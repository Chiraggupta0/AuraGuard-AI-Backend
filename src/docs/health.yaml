openapi: 3.0.0
paths:
  /health:
    get:
      summary: Health check
      description: Returns service status, uptime, and DB connection state. Not versioned — lives at the app root, not under /api/v1.
      tags:
        - System
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      uptime:
                        type: number
                      db:
                        type: string
